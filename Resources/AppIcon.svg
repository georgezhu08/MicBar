<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">MicBar app icon</title>
  <desc id="description">A white microphone with a red activity dot on a dark rounded-square background.</desc>
  <defs>
    <linearGradient id="background" x1="160" y1="96" x2="864" y2="928" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#263449"/>
      <stop offset="0.52" stop-color="#151E2D"/>
      <stop offset="1" stop-color="#0B111C"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(508 428) rotate(90) scale(440)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#58708F" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#58708F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="microphone" x1="424" y1="250" x2="604" y2="826" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCE5EF"/>
    </linearGradient>
    <linearGradient id="activity" x1="650" y1="218" x2="754" y2="346" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF6268"/>
      <stop offset="1" stop-color="#EF2638"/>
    </linearGradient>
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <filter id="micShadow" x="-30%" y="-20%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
    <filter id="dotGlow" x="-100%" y="-100%" width="300%" height="300%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <g filter="url(#iconShadow)">
    <rect x="48" y="48" width="928" height="928" rx="212" fill="url(#background)"/>
    <rect x="49.5" y="49.5" width="925" height="925" rx="210.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="3"/>
  </g>
  <rect x="48" y="48" width="928" height="928" rx="212" fill="url(#halo)"/>

  <g filter="url(#micShadow)" fill="url(#microphone)" stroke="url(#microphone)" stroke-linecap="round" stroke-linejoin="round">
    <rect x="408" y="224" width="208" height="350" rx="104" stroke="none"/>
    <path d="M348 500v30c0 126 73 218 164 218s164-92 164-218v-30" fill="none" stroke-width="46"/>
    <path d="M512 748v86" fill="none" stroke-width="46"/>
    <path d="M414 834h196" fill="none" stroke-width="46"/>
  </g>

  <circle cx="700" cy="278" r="92" fill="#FF3447" opacity="0.34" filter="url(#dotGlow)"/>
  <circle cx="700" cy="278" r="82" fill="url(#activity)" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="4"/>
  <circle cx="677" cy="253" r="24" fill="#FFFFFF" opacity="0.24"/>
</svg>
